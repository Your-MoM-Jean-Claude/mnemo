workflows:
    ios-app-store:
      name: Mnemo App Store Build
      max_build_duration: 60
      environment:
        groups:
          - app-store
        xcode: latest
      scripts:
        - name: Set up signing
          script: |
            keychain initialize
            echo "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
            keychain add-certificates \
              --certificate /tmp/cert.p12 \
              --certificate-password "$CM_CERTIFICATE_PASSWORD"
            DECODED=$(
              echo "$APP_STORE_CONNECT_PRIVATE_KEY" \
              | base64 --decode
            )
            app-store-connect fetch-signing-files \
              com.jirifilipec.mnemoapp \
              --type IOS_APP_STORE \
              --private-key "$DECODED" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --create
        - name: Build IPA
          script: |
            xcode-project use-profiles
            xcode-project build-ipa \
              --project "LexiDrill.xcodeproj" \
              --scheme "LexiDrill"
      artifacts:
        - build/ios/ipa/*.ipa
      publishing:
        app_store_connect:
          api_key: $APP_STORE_CONNECT_PRIVATE_KEY
          key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
          issuer_id: $APP_STORE_CONNECT_ISSUER_ID
          submit_to_testflight: true
