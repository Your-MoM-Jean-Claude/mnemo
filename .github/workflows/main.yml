name: Deploy LexiDrill to App Store

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-26
    env:
      CERT_B64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
      CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD }}
      KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
      PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      ASC_KEY_B64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Fix icon (remove alpha, resize to 1024x1024)
        run: |
          ICON=LexiDrill/Assets.xcassets/AppIcon.appiconset/imgmnemo.png
          sips --resampleHeightWidth 1024 1024 -s format bmp "$ICON" --out /tmp/icon.bmp
          sips -s format png /tmp/icon.bmp --out "$ICON"
          rm /tmp/icon.bmp

      - name: Install certificate
        run: |
          security create-keychain -p "$KC_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PASS" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          echo "$CERT_B64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" build.keychain
          rm cert.p12

      - name: Install provisioning profile
        run: |
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          echo "$PROFILE_B64" | base64 --decode > /tmp/mnemo.mobileprovision
          echo "Decoded size: $(wc -c < /tmp/mnemo.mobileprovision)"
          PROF_UUID=$(python3 -c "import re; d=open('/tmp/mnemo.mobileprovision','rb').read().decode('latin-1'); m=re.search(r'UUID</key>\s*<string>([^<]+)</string>',d); print(m.group(1).strip() if m else '')")
          echo "Profile UUID: $PROF_UUID"
          if [ -z "$PROF_UUID" ]; then echo "ERROR: UUID not found"; exit 1; fi
          cp /tmp/mnemo.mobileprovision "$PROF_DIR/$PROF_UUID.mobileprovision"
          rm /tmp/mnemo.mobileprovision
          echo "PROF_UUID=$PROF_UUID" >> "$GITHUB_ENV"

      - name: Install ASC key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Build archive
        run: |
          XCODE=$(ls /Applications | grep "Xcode_" | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "/Applications/$XCODE"
          fi
          xcodebuild -version
          xcodebuild archive \
            -project LexiDrill.xcodeproj \
            -scheme LexiDrill \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath LexiDrill.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROF_UUID" \
            CODE_SIGN_IDENTITY="iPhone Distribution"

      - name: Export IPA
        run: |
          PLIST=ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store" $PLIST
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" $PLIST
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" $PLIST
          /usr/libexec/PlistBuddy -c "Add :compileBitcode bool false" $PLIST
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" $PLIST
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.jirifilipec.mnemoapp string $PROF_UUID" $PLIST
          xcodebuild -exportArchive \
            -archivePath LexiDrill.xcarchive \
            -exportPath Export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to App Store
        run: |
          xcrun altool --upload-app \
            -f Export/LexiDrill.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
